name: CI

on:

  pull_request:

    branches:

      - main

jobs:

  lint:

    name: Lint

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code

        uses: actions/checkout@v4

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: 22

          cache: npm

      - name: Install dependencies

        run: npm ci

      - name: Run Lint

        run: npm run lint

  trivy:

    name: Trivy

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code

        uses: actions/checkout@v4

      - name: Run Trivy

        uses: aquasecurity/trivy-action@master

        with:

          scan-type: fs

          scan-ref: .

          severity: CRITICAL,HIGH

          exit-code: 1

  sonarqube:

    name: SonarQube

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

      - name: SonarQube Scan

        uses: SonarSource/sonarqube-scan-action@v7

        env:

          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  build:

    name: Build

    runs-on: ubuntu-latest

    needs:

      - lint

      - trivy

      - sonarqube

    steps:

      - name: Checkout code

        uses: actions/checkout@v4

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: 22

          cache: npm

      - name: Install dependencies

        run: npm ci

      - name: Build

        run: npm run build
